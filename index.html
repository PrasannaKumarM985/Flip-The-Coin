<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip The Coin</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="heading">Flip a Coin Game</div>
        <div class="subheading">Press the coin or the button to flip the coin</div>
        <div class="image"><img class="coin" src="./resources/heads.svg" alt="Coin"></div>
        <div class="shadow"><img src="./resources/shadow.svg" alt="shadow"></div>
        <div class="subheading flip">Head</div>
        <div class="button">RANDOM</div>
    </div>
    
    <script src="./flip.js"></script>
</body>
</html>
